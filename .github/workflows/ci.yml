name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One run per platform: the same steps on macOS, Ubuntu and Windows. fail-fast is off, so a failure on
  # one platform does not cancel the others.
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04, ubuntu-26.04-arm, windows-2025-vs2026, windows-11-vs2026-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain, so rustup installs exactly that version.
      - name: Install just (macOS)
        if: runner.os == 'macOS'
        run: brew install just

      # The runner's Chocolatey installs just. The MSVC toolchain is already on the runner.
      - name: Install just (Windows)
        if: runner.os == 'Windows'
        run: choco install just --yes --no-progress

      # FFmpeg is built from source by the build, so it needs nasm for the x86 assembly, plus ALSA for audio and the windowing and D-Bus headers.
      - name: Install just and the system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y just nasm libasound2-dev libclang-dev libdbus-1-dev libssl-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl-dev libegl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting, clippy and tests
        run: just check

      # Pull requests: a debug build of the whole workspace.
      - name: Build the workspace
        if: github.event_name == 'pull_request'
        run: just build

      # After a merge to main: a release build, so the shipped configuration compiles on every change to main.
      - name: Release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: just release

  # Runs alongside `check`: no `needs`, so the jobs start together. One job on Linux analyses the whole
  # workspace. CodeQL's Rust extraction runs no build and extracts every source file, but it is not
  # confirmed that code gated by `#[cfg(windows)]` gets full analysis on Linux.
  codeql:
    name: CodeQL (rust)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Rust is extracted without a build step, so no build-mode is set. The extended query
      # suite adds checks beyond the default security queries.
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
