[package]
name = "quokka-ui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
egui_system_font_provider.workspace = true
image.workspace = true
lru.workspace = true
notify.workspace = true
quokka-core.workspace = true
quokka-playback.workspace = true
rfd.workspace = true
souvlaki.workspace = true

# Linux windowing and folder-picker backends. Other platforms need no extra features.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
rfd = { workspace = true, features = ["xdg-portal"] }

# The preferred-language list, for choosing the UI's language.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true
