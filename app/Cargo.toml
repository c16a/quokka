[package]
name = "quokka-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quokka"
path = "src/main.rs"

[dependencies]
directories.workspace = true
quokka-core.workspace = true
quokka-ui.workspace = true

[features]
# The default build links FFmpeg in statically. Use --no-default-features to link a system FFmpeg 8.1
# instead; docs/relinking.md has the steps.
default = ["static-ffmpeg"]
static-ffmpeg = ["quokka-ui/static-ffmpeg"]
